<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc">
<title id="title">Reservation example: six primitive actions become one goal operation</title>
<desc id="desc">Three free units become three sold units. A six-action path holds and buys each unit. The authorized agent can call sellout once, moving directly to the final state. All resources stay conserved.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9badbd"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#81dbc1"/></marker></defs>
<rect x="1" y="1" width="1078" height="448" rx="20" fill="#142333" stroke="#394e62"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="40" y="48" font-size="13" font-weight="700" letter-spacing="3" fill="#81dbc1">EXAMPLE / RESERVATION</text>
<text x="40" y="84" fill="#f0f5fa" font-size="29" font-weight="700">Six primitive steps. One goal operation.</text>
<text x="40" y="113" fill="#b6c7d9" font-size="15">Start with three available units. Finish with all three sold.</text>
<text x="40" y="155" fill="#b6c7d9" font-size="13" font-weight="700" letter-spacing="1.5">ONE POSSIBLE SHORTEST PRIMITIVE PATH</text>
<g font-size="13" text-anchor="middle">
<g fill="#213548" stroke="#486075"><rect x="40" y="176" width="128" height="66" rx="9"/><rect x="185" y="176" width="128" height="66" rx="9"/><rect x="330" y="176" width="128" height="66" rx="9"/><rect x="475" y="176" width="128" height="66" rx="9"/><rect x="620" y="176" width="128" height="66" rx="9"/><rect x="765" y="176" width="128" height="66" rx="9"/><rect x="910" y="176" width="128" height="66" rx="9"/></g>
<g fill="#f0f5fa" font-weight="600"><text x="104" y="202">Start</text><text x="249" y="202">Hold</text><text x="394" y="202">Buy</text><text x="539" y="202">Hold</text><text x="684" y="202">Buy</text><text x="829" y="202">Hold</text><text x="974" y="202">Buy</text></g>
<g fill="#b6c7d9"><text x="104" y="223">3 free</text><text x="249" y="223">1 held</text><text x="394" y="223">1 sold</text><text x="539" y="223">1 held</text><text x="684" y="223">2 sold</text><text x="829" y="223">1 held</text><text x="974" y="223">3 sold</text></g>
</g>
<g stroke="#9badbd" stroke-width="1.5" marker-end="url(#a)"><path d="M169 209H181"/><path d="M314 209H326"/><path d="M459 209H471"/><path d="M604 209H616"/><path d="M749 209H761"/><path d="M894 209H906"/></g>
<text x="40" y="281" font-size="13" font-weight="700" letter-spacing="1.5" fill="#81dbc1">GENERATED GOAL TRANSITION</text>
<rect x="40" y="298" width="192" height="83" rx="10" fill="#203b40" stroke="#81dbc1"/>
<text x="136" y="326" text-anchor="middle" fill="#f0f5fa" font-size="18" font-weight="700">3 free</text><text x="136" y="350" text-anchor="middle" fill="#b6c7d9" font-size="13">version 0</text>
<path d="M247 342H833" stroke="#81dbc1" stroke-width="2" marker-end="url(#b)"/>
<rect x="370" y="309" width="338" height="62" rx="12" fill="#203b40" stroke="#81dbc1"/>
<text x="539" y="335" text-anchor="middle" fill="#81dbc1" font-family="monospace" font-size="18" font-weight="700">agent: sellout</text><text x="539" y="355" text-anchor="middle" fill="#d0e4df" font-size="13">one private state update</text>
<rect x="848" y="298" width="190" height="83" rx="10" fill="#203b40" stroke="#81dbc1"/>
<text x="943" y="326" text-anchor="middle" fill="#f0f5fa" font-size="18" font-weight="700">3 sold</text><text x="943" y="350" text-anchor="middle" fill="#b6c7d9" font-size="13">version 1</text>
<text x="40" y="422" fill="#b6c7d9" font-size="14">free + held + sold = 3 at every modeled state. No real tickets or payments are involved.</text>
</g>
</svg>
